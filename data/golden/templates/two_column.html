<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #ffffff; }
  body { width: 1240px; box-sizing: border-box; padding: 90px 80px;
         font-family: "DejaVu Sans", Arial, sans-serif; font-size: 19px; line-height: 1.4; color: #141414; }
  h1 { font-size: 22px; text-align: center; margin: 0 0 24px; padding-bottom: 12px; border-bottom: 2px solid #333333; }
  main { column-count: 2; column-gap: 48px; column-rule: 1px solid #bbbbbb; }
  .block { margin: 0 0 12px; text-align: justify; break-inside: avoid-column; }
  .lead { font-weight: bold; margin-right: 0.35em; }
  .lead:empty { margin: 0; }
</style>
</head>
<body>
<h1>$title</h1>
<main>
$blocks
</main>
</body>
</html>
