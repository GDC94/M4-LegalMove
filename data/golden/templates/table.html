<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #ffffff; }
  body { width: 1240px; box-sizing: border-box; padding: 90px 90px;
         font-family: "DejaVu Sans", Arial, sans-serif; font-size: 19px; line-height: 1.4; color: #111111; }
  h1 { font-size: 22px; text-align: left; margin: 0 0 22px; letter-spacing: 0.02em; }
  main { display: table; width: 100%; border-collapse: collapse; }
  .block { display: table-row; }
  .lead, .body { display: table-cell; border: 1px solid #555555; padding: 8px 12px; vertical-align: top; }
  .lead { width: 240px; font-weight: bold; background: #f1f1f1; }
  .body { text-align: justify; }
  .lead:empty { background: transparent; }
</style>
</head>
<body>
<h1>$title</h1>
<main>
$blocks
</main>
</body>
</html>
