reference_summary: >-
  La Cláusula Cuarta eleva la disponibilidad mensual garantizada del 99,5 % al 99,9 % y reduce la respuesta a incidentes críticos de cuatro (4) a dos (2) horas. La Cláusula Sexta extiende el preaviso de rescisión sin causa de sesenta (60) a noventa (90) días. Se agrega la Cláusula Octava sobre protección de datos personales conforme a la Ley 25.326, con aviso de incidentes de seguridad dentro de las cuarenta y ocho (48) horas.
