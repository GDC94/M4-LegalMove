reference_summary: >-
  El descuento de compra de la Cláusula Segunda sube del dieciocho por ciento (18 %) al veintidós por ciento (22 %) sobre la lista de precios mayoristas. El preaviso de rescisión de la Cláusula Séptima pasa de sesenta (60) a noventa (90) días. Se agrega la Cláusula Octava, que obliga a la DISTRIBUIDORA a enviar dentro de los diez (10) primeros días de cada mes un informe de las ventas del mes anterior por cliente y por producto.
