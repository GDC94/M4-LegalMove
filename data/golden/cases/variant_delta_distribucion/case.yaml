reference_summary: >-
  La Cláusula Primera deja fuera del objeto la promoción en puntos de venta: la DISTRIBUIDORA conserva la venta a comercios minoristas y la logística de entrega. La Cláusula Quinta agrega que, si la DISTRIBUIDORA no alcanza la compra mínima en dos (2) trimestres consecutivos, la PROVEEDORA podrá designar otros distribuidores en el mismo territorio.
