reference_summary: >-
  El Artículo VI extiende la obligación de reserva posterior al contrato de un (1) año a tres (3) años. Se agrega el Artículo IX, que permite a la CARGADORA inspeccionar los camiones asignados antes de cada carga y rechazar los que no estén limpios o no cierren de forma hermética.
