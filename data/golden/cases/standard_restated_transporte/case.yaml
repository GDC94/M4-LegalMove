reference_summary: >-
  El Artículo II amplía la capacidad de doce (12) a dieciocho (18) camiones semirremolque por semana. El Artículo VII eleva el tope de responsabilidad de la TRANSPORTISTA del valor declarado al ciento veinte por ciento (120 %) del valor declarado en la carta de porte. Se agrega el Artículo IX, que obliga a equipar cada camión con rastreo satelital y a dar a la CARGADORA acceso en línea a la ubicación de sus cargas.
