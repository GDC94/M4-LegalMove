reference_summary: >-
  El Artículo VI extiende la obligación de confidencialidad posterior al contrato de dos (2) a cinco (5) años. Se agrega el Artículo IX, que permite a la LICENCIANTE verificar una vez por año, con diez (10) días hábiles de aviso, que no se exceda la cantidad de usuarios concurrentes licenciada.
